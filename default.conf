server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Plexivo App Runner sends traffic only once this answers.
    location = /healthz { access_log off; default_type application/json; return 200 '{"ok":true}'; }
    location / { try_files $uri $uri/ =404; }
}
